# MyFans — local development Docker Compose
#
# Services:
#   postgres        — PostgreSQL 15 (persistent volume)
#   redis           — Redis 7
#   api             — NestJS backend with hot-reload (bind-mounted source)
#   worker-poller   — Soroban event poller (hot-reload)
#   worker-outbox   — Email outbox worker (hot-reload)
#   frontend        — Next.js dev server (bind-mounted source)
#
# Usage:
#   cp backend/.env.example backend/.env.dev   # fill in JWT_SECRET etc.
#   docker compose -f docker-compose.dev.yml --profile dev up
#
# Health checks use /v1/health/ready so the readiness probe always reflects
# real dependency state (DB, Redis). See backend/docs/API_QUICKSTART.md.

x-backend-dev-env: &backend-dev-env
  env_file: ./backend/.env.dev
  environment:
    NODE_ENV: development
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    STARTUP_MODE: degraded
    STARTUP_PROBE_RPC: "false"

services:
  # ──────────────────────────────────────────────────────────────
  # Postgres
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    user: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-myfans}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-myfans_dev}
      POSTGRES_DB: ${DB_NAME:-myfans}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myfans} -d ${DB_NAME:-myfans}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ──────────────────────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ──────────────────────────────────────────────────────────────
  # API — NestJS hot-reload (dev)
  # ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    profiles: [dev]
    <<: *backend-dev-env
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/test:/app/test:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────────────────────────
  # Worker — Soroban event poller (dev)
  # ──────────────────────────────────────────────────────────────
  worker-poller:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    profiles: [dev]
    <<: *backend-dev-env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FEATURE_SOROBAN_POLLER: "true"
      WORKER_MODE: poller
      STARTUP_MODE: degraded
      STARTUP_PROBE_RPC: "false"
    command: ["npm", "run", "start:dev"]
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ──────────────────────────────────────────────────────────────
  # Worker — Email outbox processor (dev)
  # ──────────────────────────────────────────────────────────────
  worker-outbox:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    profiles: [dev]
    <<: *backend-dev-env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: outbox
      STARTUP_MODE: degraded
      STARTUP_PROBE_RPC: "false"
    command: ["npm", "run", "start:dev"]
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ──────────────────────────────────────────────────────────────
  # Frontend — Next.js dev server
  # ──────────────────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    restart: unless-stopped
    profiles: [dev]
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_dev_data:
  frontend_node_modules:
