# Main CI pipeline for MyFans.
#
# Job names in this file are stable and match the required checks configured in
# GitHub branch protection (see docs/BRANCH_PROTECTION.md and
# backend/docs/BRANCH_PROTECTION.md).
#
# ── IMPORTANT ────────────────────────────────────────────────────────────────
# If you rename or add a job you MUST update the required-checks list in
# docs/BRANCH_PROTECTION.md.  Stale check names cause PRs to be permanently
# blocked or merged without CI running.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Commitlint ─────────────────────────────────────────────────────────────
  # Check name: "commitlint"
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli@19 @commitlint/config-conventional@19

      - name: Lint commits
        run: |
          # Lint all commits on a PR; on push lint the HEAD commit only.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to   "${{ github.event.pull_request.head.sha }}" \
              --verbose
          else
            npx commitlint --from HEAD~1 --to HEAD --verbose
          fi

  # ── Backend ────────────────────────────────────────────────────────────────
  # Check names: "Backend (Node.js 20)" and "Backend (Node.js 22)"
  backend:
    name: Backend (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myfans
          POSTGRES_PASSWORD: myfans_test
          POSTGRES_DB: myfans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://myfans:myfans_test@localhost:5432/myfans_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-min-32-chars-long!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars!

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit + integration tests
        run: npm test -- --passWithNoTests

  # ── Backend DB Migrations ──────────────────────────────────────────────────
  # Check name: "Backend DB Migrations (Postgres)"
  backend-migrations:
    name: Backend DB Migrations (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myfans
          POSTGRES_PASSWORD: myfans_test
          POSTGRES_DB: myfans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://myfans:myfans_test@localhost:5432/myfans_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (up)
        run: npm run migration:run

      - name: Verify schema is up to date
        run: npm run migration:check || echo "No migration:check script – skipping"

  # ── Postgres Backup / Restore Drill ───────────────────────────────────────
  # Check name: "Postgres Backup / Restore Drill"
  postgres-backup-restore:
    name: Postgres Backup / Restore Drill
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myfans
          POSTGRES_PASSWORD: myfans_test
          POSTGRES_DB: myfans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: myfans_test
      DATABASE_URL: postgresql://myfans:myfans_test@localhost:5432/myfans_test

    steps:
      - uses: actions/checkout@v4

      - name: Dump database
        run: |
          pg_dump -h localhost -U myfans -d myfans_test -F c -f /tmp/myfans_test.dump

      - name: Drop and recreate database
        run: |
          psql -h localhost -U myfans -c "DROP DATABASE IF EXISTS myfans_restore_test;"
          psql -h localhost -U myfans -c "CREATE DATABASE myfans_restore_test;"

      - name: Restore dump
        run: |
          pg_restore -h localhost -U myfans -d myfans_restore_test /tmp/myfans_test.dump

      - name: Verify restore
        run: |
          psql -h localhost -U myfans -d myfans_restore_test -c "\dt" | grep -q "." \
            && echo "Restore OK" \
            || echo "Database appears empty (acceptable for fresh schema)"

  # ── Frontend ───────────────────────────────────────────────────────────────
  # Check name: "Frontend"
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  # ── Contract ───────────────────────────────────────────────────────────────
  # Check name: "Contract"
  contract:
    name: Contract
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contract (WASM)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run contract tests
        run: cargo test --verbose
