      # Regression gate: run the entire contract workspace test suite.
      # `--workspace` ensures every crate (including non-production helpers) is
      # exercised, so a broken wasm crate cannot merge to main.
      - name: Run workspace tests
        run: cargo test --workspace
        working-directory: contract

      # Verify wasm release build independently from cargo test, which uses the host target.
      # cargo test compiles for the native architecture, while the wasm build targets wasm32-unknown-unknown.
      # This step ensures all production contracts compile correctly for deployment to Soroban.
      # Package list mirrors contract/scripts/snapshot-abi.sh PACKAGES.
      - name: Build all production contracts to wasm

      - name: Fail on unexpected ABI snapshot diff
        run: |
          if ! git diff --exit-code -- abi-snapshots/; then
            echo "::error::ABI snapshots are stale. Run 'contract/scripts/snapshot-abi.sh' and commit the updated files under contract/abi-snapshots/."
            echo "See contract/abi-snapshots/README.md for the contributor update procedure."
            exit 1
          fi

  # ─────────────────────────────────────────────
  # Contract interface-docs drift (Issue #1755)
  # Ensures every public contract interface change
  # is reflected in the interface docs. Required
  # check for branch protection.
  # ─────────────────────────────────────────────
  contract-interface-docs-drift:
    name: Contract — interface docs drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract

  contract-audit:
    name: Contract Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract -> target

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Fails on any vulnerability advisory (including high/critical) unless it is
      # explicitly ignored in contract/audit.toml or contract/.auditignore with a
      # documented reason. Critical advisories must link a tracking issue.
      - name: Run cargo audit
        run: cargo audit --deny warnings
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check interface docs drift
        run: node scripts/check-interface-docs-drift.mjs

  # ─────────────────────────────────────────────
  # Security hardening + CSRF e2e (Issue #1807)
  # Runs the hardening and CSRF e2e suites on every PR
  # against a real Postgres service container so regressions
  # cannot merge to main. This job name is the required
  # status check documented in backend/docs/BRANCH_PROTECTION.md.
  # ─────────────────────────────────────────────
  security-hardening-e2e:
    name: Security — hardening + csrf e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security hardening e2e
        run: npm test -- --runInBand test/security-hardening.e2e-spec.ts

      - name: Run csrf e2e
        run: npm test -- --runInBand test/csrf.e2e-spec.ts
