# Main PR / push CI.
#
# Job `name:` values are GitHub status-check contexts. The ones marked
# "Required check" below are listed in .github/required-checks.json and
# docs/BRANCH_PROTECTION.md; renaming a job without updating both breaks
# branch protection, and scripts/ci/verify-required-checks.mjs fails the PR.
#
# Required jobs must never use `continue-on-error`.

name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Required-check alignment (Issue #1847)
  # Fails when a required check name in
  # .github/required-checks.json no longer matches
  # a job in the named workflow, when the docs drift,
  # or when a required job can silently pass.
  # ─────────────────────────────────────────────
  required-checks-alignment:
    name: Repo — required checks alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required check names
        run: node scripts/ci/verify-required-checks.mjs

      - name: CI script tests
        run: node --test 'scripts/ci/*.test.mjs'

  # ─────────────────────────────────────────────
  # Backend unit tests
  # ─────────────────────────────────────────────
  backend-unit:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test -- --passWithNoTests

      # OpenAPI drift check: regenerate the spec from the AppModule controllers
      # and fail if the committed baseline (backend/openapi.json) is stale or if
      # any controller path is neither documented nor explicitly excluded.
      - name: OpenAPI drift check
        run: npm run openapi:check

  # ─────────────────────────────────────────────
  # Backend e2e tests (Issue #1646)
  # Runs security-hardening, csrf, rbac, rate-limit
  # and all other e2e suites against a real Postgres.
  # Does NOT require a live Soroban node — mock RPC
  # is used wherever Stellar calls are made.
  # ─────────────────────────────────────────────
  backend-e2e:
    name: Backend — e2e tests (Postgres)
    runs-on: ubuntu-latest
    needs: backend-unit

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myfans
          POSTGRES_PASSWORD: myfans_ci
          POSTGRES_DB: myfans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfans"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: myfans
      DB_PASSWORD: myfans_ci
      DB_NAME: myfans_test
      JWT_SECRET: ci-test-secret-not-for-production
      WEBHOOK_SECRET: ci-webhook-secret-not-for-production
      STELLAR_NETWORK: testnet
      SOROBAN_RPC_URL: http://localhost:8000
      STARTUP_MODE: degraded
      STARTUP_PROBE_DB: "true"
      STARTUP_PROBE_RPC: "false"
      FEATURE_SOROBAN_POLLER: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U myfans; do
            echo "Waiting for postgres…"
            sleep 2
          done

      - name: Run e2e tests (security, csrf, rbac, rate-limit, and all suites)
        run: npm run test:e2e -- --testPathPattern="(security-hardening|csrf|rbac|rate-limit|cors-security|app|health|posts|subscriptions|creators|feature-flags|body-limits|api-versioning|social-links|games|likes|content-upload|comments|conversations|idempotency)" --passWithNoTests
        timeout-minutes: 10

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-logs
          path: |
            backend/test-results/
            backend/logs/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Security hardening + CSRF e2e (Issue #1807)
  # Runs the hardening and CSRF e2e suites on every PR
  # against a real Postgres service container so regressions
  # cannot merge to main.
  # ─────────────────────────────────────────────
  security-hardening-e2e:
    name: Security — hardening + csrf e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security hardening e2e
        run: npm test -- --runInBand test/security-hardening.e2e-spec.ts

      - name: Run csrf e2e
        run: npm test -- --runInBand test/csrf.e2e-spec.ts

  # ─────────────────────────────────────────────
  # Frontend ESLint (Issue #1847) — Required check
  # ─────────────────────────────────────────────
  frontend-eslint:
    name: Frontend — eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ─────────────────────────────────────────────
  # Frontend Vitest (Issue #1847) — Required check
  # ─────────────────────────────────────────────
  frontend-vitest:
    name: Frontend — vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

  # ─────────────────────────────────────────────
  # Freighter test vectors (Issue #1758)
  # Compares frontend subscribe/cancel/extend
  # builder output against the golden XDR arg
  # vectors committed under contract/test-vectors/.
  # A mismatch fails the build so builder
  # regressions cannot ship empty/wrong invoke txs.
  # ─────────────────────────────────────────────
  frontend-test-vectors:
    name: Frontend — Freighter test vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compare builders to golden vectors
        run: npm run test:vectors

  # ─────────────────────────────────────────────
  # Demo routes gate (Issue #1835)
  # Fails the build if demo-only routes (wallet-demo,
  # error-test, ui, subscribe-example, settings-demo)
  # are reachable in a production build. Preview
  # environments keep demos enabled via the
  # ALLOW_DEMO_ROUTES flag. See frontend/docs/DEMO_ROUTES.md.
  # ─────────────────────────────────────────────
  demo-routes-gate:
    name: Frontend — demo routes gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Production build must not expose demo routes.
      - name: Check demo routes are gated in prod
        run: node scripts/check-demo-routes.mjs
        env:
          NODE_ENV: production
          ALLOW_DEMO_ROUTES: "false"

      # Preview environments are allowed to keep demos enabled.
      - name: Check demo routes allowed in preview
        run: node scripts/check-demo-routes.mjs
        env:
          NODE_ENV: production
          ALLOW_DEMO_ROUTES: "true"

  # ─────────────────────────────────────────────
  # Storybook build (Issue #1842)
  # Builds the frontend Storybook so broken stories or
  # missing decorators/providers fail the PR instead of
  # silently breaking design review.
  # ─────────────────────────────────────────────
  storybook-build:
    name: Frontend — storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

  # ─────────────────────────────────────────────
  # Staging parity (Issue #1844)
  # Enforces STAGING_PARITY_CHECKLIST.md: NEXT_PUBLIC_*
  # consistency, network vs RPC host, and non-empty
  # contract ids. Fails closed so a mismatched staging
  # deploy cannot proceed. Required check for staging.
  # ─────────────────────────────────────────────
  staging-parity:
    name: Staging — parity check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run staging parity check
        run: node scripts/check-staging-parity.mjs

  # ─────────────────────────────────────────────
  # Contract workspace tests + wasm build
  # ─────────────────────────────────────────────
  contract-tests:
    name: Contract — tests + wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contract

    env:
      # Production contracts that must build to wasm32-unknown-unknown.
      # Mirrors contract/scripts/snapshot-abi.sh PACKAGES.
      PROD_PACKAGES: >-
        myfans-token
        creator-registry
        creator-deposits
        creator-earnings
        subscription
        content-access
        content-likes
        earnings
        treasury

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract -> target

      # Regression gate: run the entire contract workspace test suite.
      # `--workspace` ensures every crate (including non-production helpers) is
      # exercised, so a broken wasm crate cannot merge to main.
      - name: Run workspace tests
        run: cargo test --workspace

      # Verify wasm release build independently from cargo test, which uses the host target.
      # cargo test compiles for the native architecture, while the wasm build targets wasm32-unknown-unknown.
      # This step ensures all production contracts compile correctly for deployment to Soroban.
      - name: Build all production contracts to wasm
        run: |
          for pkg in $PROD_PACKAGES; do
            echo "::group::Building $pkg"
            cargo build --release --target wasm32-unknown-unknown -p "$pkg"
            echo "::endgroup::"
          done

      # Contract ID validator used by release smoke (Issue #1848).
      - name: Contract ID validator tests
        run: node --test ./scripts/validate-contract-ids.test.mjs

  # ─────────────────────────────────────────────
  # Contract ABI snapshot drift (Issue #1755)
  # Regenerates ABI snapshots for every workspace
  # contract and fails if the committed snapshots
  # under contract/abi-snapshots/ are stale.
  # ─────────────────────────────────────────────
  contract-abi-snapshot:
    name: Contract — ABI snapshot drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-abi-${{ hashFiles('contract/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-abi-

      - name: Regenerate ABI snapshots
        run: bash scripts/snapshot-abi.sh

      - name: Fail on unexpected ABI snapshot diff
        run: |
          if ! git diff --exit-code -- abi-snapshots/; then
            echo "::error::ABI snapshots are stale. Run 'contract/scripts/snapshot-abi.sh' and commit the updated files under contract/abi-snapshots/."
            echo "See contract/abi-snapshots/README.md for the contributor update procedure."
            exit 1
          fi

  # ─────────────────────────────────────────────
  # Contract interface-docs drift (Issue #1755)
  # Ensures every public contract interface change
  # is reflected in the interface docs.
  # ─────────────────────────────────────────────
  contract-interface-docs-drift:
    name: Contract — interface docs drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check interface docs drift
        run: node scripts/check-interface-docs-drift.mjs
