name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # #1643 — Contract: build, test every workspace member, security audit
  # ──────────────────────────────────────────────────────────────────────────
  contract-test:
    name: Contract – cargo test (all workspace members)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pin to the MSRV declared in Cargo.toml [workspace.package].
          # Bump here only when the workspace rust-version is bumped.
          toolchain: "1.74"
          targets: wasm32-unknown-unknown

      # Cache compiled artifacts to keep the job under the timeout budget.
      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Compile every workspace member for the native target (fast; catches
      # type errors without needing a Wasm toolchain build).
      - name: cargo check (workspace, native)
        run: cargo check --workspace

      # Run the full test suite across ALL workspace members.
      # This satisfies the #1643 requirement that the contract CI job does not
      # test only a single crate.
      - name: cargo test (workspace)
        run: cargo test --workspace
        env:
          RUST_BACKTRACE: "1"

  # ──────────────────────────────────────────────────────────────────────────
  # #1643 — Contract: cargo audit (fail on high/critical advisories)
  # ──────────────────────────────────────────────────────────────────────────
  contract-audit:
    name: Contract – cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.74"

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version "0.21.2"

      # audit.toml sets severity_threshold = "high" and lists known acceptable
      # advisories with justification comments.  Any new high/critical advisory
      # that is not documented in audit.toml will fail this job.
      - name: cargo audit
        run: cargo audit --file audit.toml

  # ──────────────────────────────────────────────────────────────────────────
  # #1644 — Contract test vectors: TS fingerprint check (Freighter / XDR)
  # ──────────────────────────────────────────────────────────────────────────
  contract-test-vectors:
    name: Contract – Freighter XDR test vectors (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Run only the test-vector spec so CI feedback is targeted.
      - name: Run XDR fingerprint test vectors
        run: npx vitest run src/lib/__tests__/contract-test-vectors.test.ts

  # ──────────────────────────────────────────────────────────────────────────
  # #1645 — Frontend: lint + unit tests + build
  # ──────────────────────────────────────────────────────────────────────────
  frontend-lint-test:
    name: Frontend – ESLint + Vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Cache npm dependencies using the frontend lock file.
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint — NO continue-on-error; lint failures block merge.
      # Warn policy: zero warnings allowed in CI (--max-warnings 0).
      # See frontend/docs/LINT_POLICY.md for the rationale.
      - name: ESLint
        run: npm run lint -- --max-warnings 0

      # Vitest unit tests — NO continue-on-error.
      - name: Vitest unit tests
        run: npm test

      # Next.js build — kept from the previous CI config.
      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────────
  # Backend: lint + unit tests (pre-existing job, kept for completeness)
  # ──────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend – lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test
