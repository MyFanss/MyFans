# Main PR / push CI.
#
# Job `name:` values are GitHub status-check contexts. The ones marked
# "Required check" below are listed in .github/required-checks.json and
# docs/BRANCH_PROTECTION.md; renaming a job without updating both breaks
# branch protection, and scripts/ci/verify-required-checks.mjs fails the PR.
#
# Required jobs must never use `continue-on-error`.

name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Required-check alignment (Issue #1847)
  # Fails when a required check name in
  # .github/required-checks.json no longer matches
  # a job in the named workflow, when the docs drift,
  # or when a required job can silently pass.
  # ─────────────────────────────────────────────
  required-checks-alignment:
    name: Repo — required checks alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify required check names
        run: node scripts/ci/verify-required-checks.mjs

      - name: CI script tests
        run: node --test 'scripts/ci/*.test.mjs'

  # ─────────────────────────────────────────────
  # Monorepo check (Issue #1862)
  # Runs the single root `check` script so CI and
  # local runs share one orchestration path. The
  # script enforces the contract → backend →
  # frontend order and attributes any failure to
  # the offending package by name.
  # ─────────────────────────────────────────────
  monorepo-check:
    name: Repo — monorepo check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install all workspaces
        run: npm run install:all

      - name: Run root check (contract → backend → frontend)
        run: npm run check

  # ─────────────────────────────────────────────
  # Backend unit tests
  # ─────────────────────────────────────────────
  backend-unit:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test -- --passWithNoTests

      # OpenAPI drift check: regenerate the spec from the AppModule controllers
      # and fail if the committed baseline (backend/openapi.json) is stale or if
      # any controller path is neither documented nor explicitly excluded.
      - name: OpenAPI drift check
        run: npm run openapi:check

  # ─────────────────────────────────────────────
  # Backend e2e tests (Issue #1646)
  # Runs security-hardening, csrf, rbac, rate-limit
  # and all other e2e suites against a real Postgres.
  # Does NOT require a live Soroban node — mock RPC
  # is used wherever Stellar calls are made.
  # ─────────────────────────────────────────────
  backend-e2e:
    name: Backend — e2e tests (Postgres)
    runs-on: ubuntu-latest
    needs: backend-unit

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myfans
          POSTGRES_PASSWORD: myfans_ci
          POSTGRES_DB: myfans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfans"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: myfans
      DB_PASSWORD: myfans_ci
      DB_NAME: myfans_test
      JWT_SECRET: ci-test-secret-not-for-production
      WEBHOOK_SECRET: ci-webhook-secret-not-for-production
      STELLAR_NETWORK: testnet
      SOROBAN_RPC_URL: http://localhost:8000
      STARTUP_MODE: degraded
      STARTUP_PROBE_DB: "true"
      STARTUP_PROBE_RPC: "false"
      FEATURE_SOROBAN_POLLER: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U myfans; do
            echo "Waiting for postgres…"
            sleep 2
          done

      - name: Run e2e tests (security, csrf, rbac, rate-limit, and all suites)
        run: npm run test:e2e -- --testPathPattern="(security-hardening|csrf|rbac|rate-limit|cors-security|app|health|posts|subscriptions|creators|feature-flags|body-limits|api-versioning|social-links|games|likes|content-upload|comments|conversations|idempotency)" --passWithNoTests
        timeout-minutes: 10

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-e2e-logs
          path: |
            backend/test-results/
            backend/logs/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Security hardening + CSRF e2e (Issue #1807)
  # Runs the hardening and CSRF e2e suites on every PR
  # against a real Postgres service container so regressions
  # cannot merge to main.
  # ─────────────────────────────────────────────
  security-hardening-e2e:
    name: Security — hardening + csrf e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security hardening e2e
        run: npm test -- --runInBand test/security-hardening.e2e-spec.ts

      - name: Run csrf e2e
        run: npm test -- --runInBand test/csrf.e2e-spec.ts

  # ─────────────────────────────────────────────
  # Frontend ESLint (Issue #1847) — Required check
  # ─────────────────────────────────────────────
  frontend-eslint:
    name: Frontend — eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ─────────────────────────────────────────────
  # Frontend Vitest (Issue #1847) — Required check
  # ─────────────────────────────────────────────
  frontend-vitest:
    name: Frontend — vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

  # ─────────────────────────────────────────────
  # Freighter test vectors (Issue #1758)
  # Compares frontend subscribe/cancel/extend
  # builder output against the golden XDR arg
  # vectors committed under contract/test-vectors/.
  # A mismatch fails the build so builder
  # regressions cannot ship empty/wrong invoke txs.
  # ─────────────────────────────────────────────
  frontend-test-vectors:
    name: Frontend — Freighter test vectors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Freighter test vectors
        run: npm run test:vectors
