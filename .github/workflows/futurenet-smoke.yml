# Futurenet smoke test — verifies deployed contracts are reachable on Futurenet.
#
# Behaviour:
#   - If ALL required contract IDs and secrets are present → invoke getter methods
#     on every core contract and report results.
#   - If ANY required contract ID or secret is missing:
#       • On release branches (main, release/*) → fail the job (red CI) so the gap
#         is not silently ignored and broken releases are caught before shipping.
#       • On other branches   → skip with an explicit warning so feature branches are not
#         blocked by deployment secrets they don't own.
#       • Fork PRs may skip the smoke check only when the PR body contains the
#         explicit marker `[skip-futurenet-smoke]`.
#
# Required GitHub Actions secrets:
#   FUTURENET_RPC_URL              - Soroban RPC endpoint for Futurenet
#   CONTRACT_ID_SUBSCRIPTION       - Deployed subscription contract ID
#   CONTRACT_ID_MYFANS_TOKEN       - Deployed MyFans token contract ID
#   CONTRACT_ID_CREATOR_REGISTRY   - Deployed creator registry contract ID
#   CONTRACT_ID_CONTENT_ACCESS     - Deployed content access contract ID
#   CONTRACT_ID_EARNINGS           - Deployed earnings contract ID
#
# Admin key is NEVER passed to this workflow; read-only getter calls only.

name: Futurenet Smoke

on:
  # Run daily at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'
  # Run after any push to main (deployment changes)
  push:
    branches:
      - main
      - 'release/**'
  # Run on PRs so release branches fail closed before merge
  pull_request:
    branches:
      - main
      - 'release/**'
  # Allow manual triggers with optional reason
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual smoke run'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Guard: check that all required secrets / IDs are present.
  # ─────────────────────────────────────────────────────────────────────────
  check-prerequisites:
    name: Check contract IDs and secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
      missing: ${{ steps.guard.outputs.missing }}
      is_release: ${{ steps.guard.outputs.is_release }}
      fork_skip: ${{ steps.guard.outputs.fork_skip }}
    steps:
      - name: Evaluate required inputs
        id: guard
        env:
          RPC_URL:          ${{ secrets.FUTURENET_RPC_URL }}
          ID_SUBSCRIPTION:  ${{ secrets.CONTRACT_ID_SUBSCRIPTION }}
          ID_TOKEN:         ${{ secrets.CONTRACT_ID_MYFANS_TOKEN }}
          ID_REGISTRY:      ${{ secrets.CONTRACT_ID_CREATOR_REGISTRY }}
          ID_CONTENT:       ${{ secrets.CONTRACT_ID_CONTENT_ACCESS }}
          ID_EARNINGS:      ${{ secrets.CONTRACT_ID_EARNINGS }}
          REF_NAME:         ${{ github.ref_name }}
          EVENT_NAME:       ${{ github.event_name }}
          PR_BODY:          ${{ github.event.pull_request.body }}
          PR_HEAD_REPO:     ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO:        ${{ github.repository }}
        run: |
          missing=""
          [ -z "$RPC_URL" ]         && missing="$missing FUTURENET_RPC_URL"
          [ -z "$ID_SUBSCRIPTION" ] && missing="$missing CONTRACT_ID_SUBSCRIPTION"
          [ -z "$ID_TOKEN" ]        && missing="$missing CONTRACT_ID_MYFANS_TOKEN"
          [ -z "$ID_REGISTRY" ]     && missing="$missing CONTRACT_ID_CREATOR_REGISTRY"
          [ -z "$ID_CONTENT" ]      && missing="$missing CONTRACT_ID_CONTENT_ACCESS"
          [ -z "$ID_EARNINGS" ]     && missing="$missing CONTRACT_ID_EARNINGS"

          # Release branches must fail closed when IDs are empty/missing.
          is_release=false
          case "$REF_NAME" in
            main|release/*) is_release=true ;;
          esac
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

          # Fork PRs may skip only with an explicit marker in the PR body.
          fork_skip=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" != "$BASE_REPO" ]; then
            case "$PR_BODY" in
              *"[skip-futurenet-smoke]"*) fork_skip=true ;;
            esac
          fi
          echo "fork_skip=$fork_skip" >> "$GITHUB_OUTPUT"

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # Trim leading space
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Fail loudly on release branches when IDs are missing.
  # ─────────────────────────────────────────────────────────────────────────
  fail-on-missing-release:
    name: "FAIL – contract IDs missing on release branch"
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.ready == 'false' && needs.check-prerequisites.outputs.is_release == 'true' && needs.check-prerequisites.outputs.fork_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report missing secrets and fail
        run: |
          echo "::error::Futurenet smoke cannot run on release branch: missing secrets/IDs:"
          echo "::error::  ${{ needs.check-prerequisites.outputs.missing }}"
          echo ""
          echo "Add the missing secrets under Settings → Secrets and variables → Actions."
          echo "See contract/docs/CONTRACT_DEPLOY_RUNBOOK.md for the deploy + ID-write steps."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────
  # Skip gracefully on non-release branches when IDs are missing.
  # ─────────────────────────────────────────────────────────────────────────
  skip-on-missing-branch:
    name: "SKIP – contract IDs not configured (non-release)"
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.ready == 'false' && needs.check-prerequisites.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Warn and skip
        run: |
          echo "::warning::Futurenet smoke skipped – the following secrets/IDs are not set:"
          echo "::warning::  ${{ needs.check-prerequisites.outputs.missing }}"
          echo ""
          echo "This is acceptable on feature branches.  The smoke WILL fail on release"
          echo "branches (main, release/*) until all required secrets are configured."

  # ─────────────────────────────────────────────────────────────────────────
  # Explicit skip for fork PRs that opt out with the marker.
  # ─────────────────────────────────────────────────────────────────────────
  skip-fork-pr:
    name: "SKIP – fork PR opted out with [skip-futurenet-smoke]"
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.ready == 'false' && needs.check-prerequisites.outputs.fork_skip == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge explicit fork skip
        run: |
          echo "::warning::Futurenet smoke skipped for fork PR via explicit [skip-futurenet-smoke] marker."
          echo "Release branches still fail closed when IDs are empty."

  # ─────────────────────────────────────────────────────────────────────────
  # Actual smoke test – runs only when all IDs are present.
  # ─────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke – invoke contract getters on Futurenet
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      SOROBAN_NETWORK: futurenet
      SOROBAN_RPC_URL: ${{ secrets.FUTURENET_RPC_URL }}
      # Contract IDs – masked automatically by Actions because they come from secrets
      CONTRACT_ID_SUBSCRIPTION:     ${{ secrets.CONTRACT_ID_SUBSCRIPTION }}
      CONTRACT_ID_MYFANS_TOKEN:     ${{ secrets.CONTRACT_ID_MYFANS_TOKEN }}
      CONTRACT_ID_CREATOR_REGISTRY: ${{ secrets.CONTRACT_ID_CREATOR_REGISTRY }}
      CONTRACT_ID_CONTENT_ACCESS:   ${{ secrets.CONTRACT_ID_CONTENT_ACCESS }}
      CONTRACT_ID_EARNINGS:         ${{ secrets.CONTRACT_ID_EARNINGS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install stellar-cli (soroban-cli) at a pinned version
      - name: Install stellar-cli
        run: |
          cargo install stellar-cli --version 21.4.0 --locked --quiet 2>&1 | tail -5

      # Add a network config entry pointing at Futurenet RPC
      - name: Configure Futurenet network
        run: |
          stellar network add \
            --rpc-url      "$SOROBAN_RPC_URL" \
            --network-passphrase "Test SDF Future Network ; October 2022" \
            futurenet

      # ── Subscription contract ──────────────────────────────────────────
      - name: Smoke – subscription contract (get_config)
        id: smoke_subscription
        run: |
          echo "Calling get_config on subscription contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_SUBSCRIPTION" \
            --network futurenet \
            --fn      get_config \
            -- 2>&1 | tee /tmp/smoke-subscription.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── MyFans token contract ──────────────────────────────────────────
      - name: Smoke – myfans token contract (name)
        id: smoke_token
        run: |
          echo "Calling name() on myfans token contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_MYFANS_TOKEN" \
            --network futurenet \
            --fn      name \
            -- 2>&1 | tee /tmp/smoke-token.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── Creator registry contract ──────────────────────────────────────
      - name: Smoke – creator registry contract (get_admin)
        id: smoke_registry
        run: |
          echo "Calling get_admin on creator registry contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_CREATOR_REGISTRY" \
            --network futurenet \
            --fn      get_admin \
            -- 2>&1 | tee /tmp/smoke-registry.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── Content access contract ────────────────────────────────────────
      - name: Smoke – content access contract (get_admin)
        id: smoke_content
        run: |
          echo "Calling get_admin on content access contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_CONTENT_ACCESS" \
            --network futurenet \
            --fn      get_admin \
            -- 2>&1 | tee /tmp/smoke-content.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── Earnings contract ──────────────────────────────────────────────
      - name: Smoke – earnings contract (get_admin)
        id: smoke_earnings
        run: |
          echo "Calling get_admin on earnings contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_EARNINGS" \
            --network futurenet \
            --fn      get_admin \
            -- 2>&1 | tee /tmp/smoke-earnings.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── Aggregate results ──────────────────────────────────────────────
      - name: Summarise smoke results
        if: always()
        run: |
          echo "## Futurenet smoke results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/smoke-*.log; do
            [ -f "$f" ] || continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
