# Futurenet smoke test — verifies deployed contracts are reachable on Futurenet.
#
# Fail-closed contract ID gate (Issue #1848):
#   - Every required contract ID is validated by contract/scripts/validate-contract-ids.mjs
#     (missing, empty, malformed or duplicate IDs are all failures; partial sets
#     name exactly which keys are wrong).
#   - Release context → the gate job FAILS when anything is wrong, so a green
#     smoke can never ship a UI wired to nothing. Release context is:
#       • push / schedule / manual run on main or release/*
#       • pull requests whose base branch is release/*
#   - Any other context → the gate passes with warnings and the smoke is skipped.
#   - Fork PRs never receive secrets. In release context they fail unless the
#     PR body contains the explicit marker `[skip-futurenet-smoke]`, in which
#     case the gate passes with a notice saying the smoke was skipped.
#
# The validation report and redacted smoke logs are uploaded as artifacts.
# No secret values are printed: the validator reports key names and statuses
# only, and logs are scrubbed of the RPC URL and contract IDs before upload.
#
# Required GitHub Actions secrets:
#   FUTURENET_RPC_URL              - Soroban RPC endpoint for Futurenet
#   CONTRACT_ID_SUBSCRIPTION       - Deployed subscription contract ID
#   CONTRACT_ID_MYFANS_TOKEN       - Deployed MyFans token contract ID
#   CONTRACT_ID_CREATOR_REGISTRY   - Deployed creator registry contract ID
#   CONTRACT_ID_CONTENT_ACCESS     - Deployed content access contract ID
#   CONTRACT_ID_EARNINGS           - Deployed earnings contract ID
#
# Admin key is NEVER passed to this workflow; read-only getter calls only.
# Job names are required status checks for release/* — see docs/BRANCH_PROTECTION.md.

name: Futurenet Smoke

on:
  # Run daily at 06:00 UTC
  schedule:
    - cron: '0 6 * * *'
  # Run after any push to main / release branches (deployment changes)
  push:
    branches:
      - main
      - 'release/**'
  # Run on PRs so release branches fail closed before merge
  pull_request:
    branches:
      - main
      - 'release/**'
  # Allow manual triggers with optional reason
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual smoke run'

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate: validate contract IDs and decide whether the smoke may run.
  # ─────────────────────────────────────────────────────────────────────────
  gate:
    name: Futurenet smoke — contract ID gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.validate.outputs.ready }}
      is_release: ${{ steps.context.outputs.is_release }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Determine release context
        id: context
        env:
          EVENT_NAME:   ${{ github.event_name }}
          REF_NAME:     ${{ github.ref_name }}
          BASE_REF:     ${{ github.base_ref }}
          PR_BODY:      ${{ github.event.pull_request.body }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO:    ${{ github.repository }}
        run: |
          # For pull_request events ref_name is "<n>/merge", so use the base branch.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            branch="$BASE_REF"
            case "$branch" in release/*) is_release=true ;; *) is_release=false ;; esac
          else
            branch="$REF_NAME"
            case "$branch" in main|release/*) is_release=true ;; *) is_release=false ;; esac
          fi

          is_fork=false
          fork_skip=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" != "$BASE_REPO" ]; then
            is_fork=true
            case "$PR_BODY" in *"[skip-futurenet-smoke]"*) fork_skip=true ;; esac
          fi

          echo "Branch: $branch | release context: $is_release | fork PR: $is_fork | fork skip marker: $fork_skip"
          {
            echo "is_release=$is_release"
            echo "fork_skip=$fork_skip"
          } >> "$GITHUB_OUTPUT"

      - name: Validate contract IDs and RPC URL
        id: validate
        env:
          IS_RELEASE:                   ${{ steps.context.outputs.is_release }}
          FORK_SKIP:                    ${{ steps.context.outputs.fork_skip }}
          FUTURENET_RPC_URL:            ${{ secrets.FUTURENET_RPC_URL }}
          CONTRACT_ID_SUBSCRIPTION:     ${{ secrets.CONTRACT_ID_SUBSCRIPTION }}
          CONTRACT_ID_MYFANS_TOKEN:     ${{ secrets.CONTRACT_ID_MYFANS_TOKEN }}
          CONTRACT_ID_CREATOR_REGISTRY: ${{ secrets.CONTRACT_ID_CREATOR_REGISTRY }}
          CONTRACT_ID_CONTENT_ACCESS:   ${{ secrets.CONTRACT_ID_CONTENT_ACCESS }}
          CONTRACT_ID_EARNINGS:         ${{ secrets.CONTRACT_ID_EARNINGS }}
        run: |
          mkdir -p smoke-artifacts
          report=smoke-artifacts/contract-id-report.json

          strict=true
          if [ "$IS_RELEASE" != "true" ] || [ "$FORK_SKIP" = "true" ]; then
            strict=false
          fi

          args=(--env "--report=$report")
          [ "$strict" = "true" ] || args+=(--allow-missing)

          ids_ok=true
          node contract/scripts/validate-contract-ids.mjs "${args[@]}" || ids_ok=false
          if [ "$(node -p "require('./$report').valid")" != "true" ]; then
            ids_ok=false
          fi

          rpc_ok=true
          if [ -z "$FUTURENET_RPC_URL" ]; then
            rpc_ok=false
            if [ "$strict" = "true" ]; then
              echo "::error::FUTURENET_RPC_URL secret is not set"
            else
              echo "::warning::FUTURENET_RPC_URL secret is not set"
            fi
          fi

          if [ "$ids_ok" = "true" ] && [ "$rpc_ok" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"

          if [ "$FORK_SKIP" = "true" ]; then
            echo "::notice::Futurenet smoke SKIPPED for fork PR via explicit [skip-futurenet-smoke] marker."
            exit 0
          fi
          if [ "$strict" = "true" ]; then
            echo "::error::Futurenet smoke cannot run in release context with missing or invalid contract IDs."
            echo "Add or fix the secrets under Settings → Secrets and variables → Actions."
            echo "See contract/docs/CONTRACT_DEPLOY_RUNBOOK.md for the deploy + ID-write steps."
            exit 1
          fi
          echo "::warning::Futurenet smoke skipped (non-release context). It WILL fail on main and release/* until IDs are configured."

      - name: Upload contract ID report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: futurenet-contract-id-report
          path: smoke-artifacts/contract-id-report.json
          if-no-files-found: warn
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Actual smoke test – runs only when all IDs are present and valid.
  # ─────────────────────────────────────────────────────────────────────────
  smoke:
    name: Futurenet smoke — invoke contract getters
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOROBAN_NETWORK: futurenet
      SOROBAN_RPC_URL: ${{ secrets.FUTURENET_RPC_URL }}
      # Contract IDs – masked automatically by Actions because they come from secrets
      CONTRACT_ID_SUBSCRIPTION:     ${{ secrets.CONTRACT_ID_SUBSCRIPTION }}
      CONTRACT_ID_MYFANS_TOKEN:     ${{ secrets.CONTRACT_ID_MYFANS_TOKEN }}
      CONTRACT_ID_CREATOR_REGISTRY: ${{ secrets.CONTRACT_ID_CREATOR_REGISTRY }}
      CONTRACT_ID_CONTENT_ACCESS:   ${{ secrets.CONTRACT_ID_CONTENT_ACCESS }}
      CONTRACT_ID_EARNINGS:         ${{ secrets.CONTRACT_ID_EARNINGS }}
      SMOKE_LOG_DIR: smoke-logs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install stellar-cli (soroban-cli) at a pinned version
      - name: Install stellar-cli
        run: |
          cargo install stellar-cli --version 21.4.0 --locked --quiet 2>&1 | tail -5

      # Add a network config entry pointing at Futurenet RPC
      - name: Configure Futurenet network
        run: |
          mkdir -p "$SMOKE_LOG_DIR"
          stellar network add \
            --rpc-url      "$SOROBAN_RPC_URL" \
            --network-passphrase "Test SDF Future Network ; October 2022" \
            futurenet

      # ── Subscription contract ──────────────────────────────────────────
      - name: Smoke – subscription contract (get_config)
        run: |
          echo "Calling get_config on subscription contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_SUBSCRIPTION" \
            --network futurenet \
            --fn      get_config \
            -- 2>&1 | tee "$SMOKE_LOG_DIR/subscription.log"

      # ── MyFans token contract ──────────────────────────────────────────
      - name: Smoke – myfans token contract (name)
        run: |
          echo "Calling name() on myfans token contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_MYFANS_TOKEN" \
            --network futurenet \
            --fn      name \
            -- 2>&1 | tee "$SMOKE_LOG_DIR/token.log"

      # ── Creator registry contract ──────────────────────────────────────
      - name: Smoke – creator registry contract (get_admin)
        run: |
          echo "Calling get_admin on creator registry contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_CREATOR_REGISTRY" \
            --network futurenet \
            --fn      get_admin \
            -- 2>&1 | tee "$SMOKE_LOG_DIR/registry.log"

      # ── Content access contract ────────────────────────────────────────
      - name: Smoke – content access contract (get_admin)
        run: |
          echo "Calling get_admin on content access contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_CONTENT_ACCESS" \
            --network futurenet \
            --fn      get_admin \
            -- 2>&1 | tee "$SMOKE_LOG_DIR/content.log"

      # ── Earnings contract ──────────────────────────────────────────────
      - name: Smoke – earnings contract (get_admin)
        run: |
          echo "Calling get_admin on earnings contract…"
          stellar contract invoke \
            --id      "$CONTRACT_ID_EARNINGS" \
            --network futurenet \
            --fn      get_admin \
            -- 2>&1 | tee "$SMOKE_LOG_DIR/earnings.log"

      # Artifacts are not masked by Actions, so scrub secret values first.
      - name: Redact smoke logs
        if: always()
        run: |
          shopt -s nullglob
          node -e '
            const fs = require("fs");
            const names = ["SOROBAN_RPC_URL", "CONTRACT_ID_SUBSCRIPTION", "CONTRACT_ID_MYFANS_TOKEN",
              "CONTRACT_ID_CREATOR_REGISTRY", "CONTRACT_ID_CONTENT_ACCESS", "CONTRACT_ID_EARNINGS"];
            const secrets = names.map((n) => [n, process.env[n]]).filter(([, v]) => v);
            for (const file of process.argv.slice(1)) {
              let text = fs.readFileSync(file, "utf8");
              for (const [name, value] of secrets) text = text.split(value).join(`[redacted:${name}]`);
              fs.writeFileSync(file, text);
            }
          ' "$SMOKE_LOG_DIR"/*.log

      # ── Aggregate results ──────────────────────────────────────────────
      - name: Summarise smoke results
        if: always()
        run: |
          echo "## Futurenet smoke results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in "$SMOKE_LOG_DIR"/*.log; do
            [ -f "$f" ] || continue
            echo "### $(basename "$f" .log)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: futurenet-smoke-logs
          path: smoke-logs/*.log
          if-no-files-found: warn
          retention-days: 14
