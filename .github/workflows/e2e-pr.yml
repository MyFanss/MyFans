name: E2E — Required PR specs

on:
  pull_request:
    branches: [main]

jobs:
  security-hardening-e2e:
    name: Security hardening + CSRF e2e (required)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security hardening + CSRF e2e specs
        # Required list per issue #1807:
        #   security-hardening.e2e-spec.ts, csrf.e2e-spec.ts
        # Runs against the Postgres service container above so the suites
        # exercise a real database. Keep this job name stable — it is the
        # required status check documented in backend/docs/BRANCH_PROTECTION.md.
        run: >
          npx jest --config ./test/jest-e2e.json --runInBand
          security-hardening.e2e-spec.ts
          csrf.e2e-spec.ts
        env:
          CI: true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-hardening-e2e-results
          path: backend/test-results/
          retention-days: 7

  playwright:
    name: Playwright — required specs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    strategy:
      # Run shards in parallel for speed; fail-fast keeps total time short
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run required e2e specs
        # Required list per issue #1648:
        #   smoke, subscribe-flow-complete, cancel-renew-flow,
        #   content-actions, network-status
        # Sharded across 2 runners to stay under the 5-min target.
        # Mock RPC is provided via route interception in each spec file.
        run: >
          npx playwright test
          smoke.spec.ts
          subscribe-flow-complete.spec.ts
          cancel-renew-flow.spec.ts
          content-actions.spec.ts
          network-status.spec.ts
          --shard=${{ matrix.shard }}/2
          --reporter=html,github
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7
