# Dependency audits (Issues #1647, #1847).
#
# Every job here is a required status check on main and release/** — see
# .github/required-checks.json and docs/BRANCH_PROTECTION.md. Do not rename a
# job without updating both, and never add `continue-on-error` or a
# `paths:` filter (a required check that does not run blocks every PR).
#
# Exceptions live in each package's .auditignore and must link a tracking
# issue; scripts/ci/*-audit-gate.mjs rejects entries without one.

name: Security Audit

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  schedule:
    # Weekly: every Monday at 08:00 UTC (catches newly published advisories)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # npm audit — backend
  # Fails on high/critical advisories in production
  # dependencies. Low/moderate are reported only.
  # ─────────────────────────────────────────────
  npm-audit-backend:
    name: npm audit — backend (high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Audit reads the lockfile only; no install needed. A missing or corrupt
      # lockfile makes npm audit error, which the gate treats as a failure.
      - name: npm audit (high+) with .auditignore exceptions
        run: node ../scripts/ci/npm-audit-gate.mjs --audit-level=high --omit=dev

  # ─────────────────────────────────────────────
  # npm audit — frontend
  # ─────────────────────────────────────────────
  npm-audit-frontend:
    name: npm audit — frontend (high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (high+) with .auditignore exceptions
        run: node ../scripts/ci/npm-audit-gate.mjs --audit-level=high --omit=dev

  # ─────────────────────────────────────────────
  # cargo audit — contract
  # Fails on every RustSec vulnerability not listed
  # in contract/.auditignore. Unmaintained / unsound /
  # yanked warnings are annotated, not gated.
  # ─────────────────────────────────────────────
  cargo-audit:
    name: cargo audit — contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v1

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: cargo audit with .auditignore exceptions
        run: node ../scripts/ci/cargo-audit-gate.mjs
