name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly: every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  # ─────────────────────────────────────────────
  # npm audit — backend (Issue #1647)
  # Fails on high/critical vulnerabilities.
  # Low/moderate advisories are reported but do
  # not fail CI. Exceptions live in .auditignore.
  # ─────────────────────────────────────────────
  npm-audit-backend:
    name: npm audit — backend (high)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+)
        # --audit-level=high makes npm exit non-zero only for high/critical
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

  # ─────────────────────────────────────────────
  # npm audit — frontend (Issue #1647)
  # ─────────────────────────────────────────────
  npm-audit-frontend:
    name: npm audit — frontend (high)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

  # ─────────────────────────────────────────────
  # cargo audit — contract (Issue #1647)
  # Severity policy and advisory exceptions are
  # declared in contract/audit.toml.
  # ─────────────────────────────────────────────
  cargo-audit:
    name: cargo audit — contract (high)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # audit.toml sets severity_threshold = "high" and lists approved exceptions
        run: cargo audit --file audit.toml
