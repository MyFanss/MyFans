name: OpenAPI Contract

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/src/subscriptions/**"
      - "backend/src/common/openapi*.ts"
      - "backend/scripts/generate-openapi.ts"
      - ".github/workflows/openapi-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi-contract:
    name: Subscription OpenAPI drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      # Fails when a subscription route (checkout / index / spending-cap /
      # indexer) is missing its ApiOperation/ApiResponse metadata, i.e. would
      # be absent or undocumented in the published OpenAPI spec.
      - name: Subscription OpenAPI contract test
        run: npx jest --config jest.config.js subscriptions.openapi-contract subscriptions.swagger
        working-directory: backend
